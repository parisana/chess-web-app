spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chess_test_db
    username: chess_app
    password: password

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    validate-migration-naming: true

  session:
    jdbc:
      cleanup-cron: "-"
app:
  game:
    clock:
      initial-time: 10m
      timeout-scan-enabled: false
      timeout-scan-interval: 1s