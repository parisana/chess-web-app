server:
  servlet:
    session:
      cookie:
        name: CHESS_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 7d
spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: chess-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chess_db}
    username: ${DB_USERNAME:chess_app}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
app:
  notification:
    delivery:
      workers: 4
      queue-capacity: 256
  websocket:
    endpoint: /api/v1/ws
    allowed-origin: http://localhost:4200
    application-prefix: /app
    user-prefix: /user
    broker-prefix: /queue
    updates-path: /updates
    time-to-first-message: 10s
    heartbeat-interval: 10s
  game:
    clock:
      initial-time: 10m
      timeout-scan-enabled: true
      timeout-scan-interval: 1s