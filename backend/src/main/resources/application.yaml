spring:
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: chess-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chess_db}
    username: ${DB_USERNAME:chess_app}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration