spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

logging:
  level:
    org.hibernate.SQL: DEBUG

    # Change to TRACE when you need bound parameter values.
    org.hibernate.orm.jdbc.bind: TRACE

    # Includes JdbcTemplate operations, which Hibernate logging misses.
    org.springframework.jdbc.core.JdbcTemplate: DEBUG