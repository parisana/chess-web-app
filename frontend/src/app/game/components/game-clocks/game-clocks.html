<ng-template #clockRow let-row>
  <div class="clock-row" [class.running]="row.running" [class.your-row]="row.isYou">
    <div class="participant">
      <span class="colour-marker" [class.white]="row.color === 'WHITE'" aria-hidden="true"></span>

      <span class="participant-name" [title]="row.name">
        {{ row.name }}
      </span>
      @if (row.rating !== null) {
      <span class="participant-rating" title="Rating when the match started">
        · {{ row.rating }}
      </span>
      } @else {
      <span class="participant-rating" title="Starting rating was not recorded for this game"
        aria-label="Starting rating unavailable">
        · —
      </span>
      }

      <span class="identity-badge" [class.you]="row.isYou">
        {{ row.isYou ? 'You' : 'Opponent' }}
      </span>
    </div>

    <span class="time" [attr.aria-label]="
        row.name + ', ' +
        (row.color === 'WHITE' ? 'White' : 'Black') + ', ' +
        (row.timed
          ? row.time + (row.running ? ', running' : ', stopped')
          : 'untimed')
      ">
      {{ row.time }}
    </span>
  </div>
</ng-template>

<div class="board-with-clocks">
  <ng-container [ngTemplateOutlet]="clockRow" [ngTemplateOutletContext]="{ $implicit: topClock() }" />

  <div class="board-slot">
    <ng-content />
  </div>

  <ng-container [ngTemplateOutlet]="clockRow" [ngTemplateOutletContext]="{ $implicit: bottomClock() }" />
</div>

@if (display()?.awaitingResult) {
<p class="clock-notice" role="status">
  Time appears to have expired. Waiting for the server result.
</p>
}
