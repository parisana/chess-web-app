<main class="home-page">
  @if (auth.currentPlayer(); as player) {
  <div class="home-workspace">
    <section class="board-area" aria-label="Waiting board">
      <div class="board-stage">
        <div class="participant-row">
          <span class="muted">Opponent</span>
          <span class="waiting-clock" aria-label="No opponent clock">
            —:—
          </span>
        </div>

        <app-chess-board [fen]="initialFen" orientation="WHITE" [enabled]="false" />

        <div class="participant-row your-row">
          <div class="participant-name">
            <strong>{{ player.username }}</strong>
            <span class="you-badge">You</span>
          </div>

          <span class="waiting-clock" aria-label="No active clock">
            —:—
          </span>
        </div>

        <p class="board-help muted">
          Find a match to start playing.
        </p>
      </div>
    </section>

    <aside class="right-panel" aria-label="Play and profile">
      <section class="panel profile-summary" aria-label="Your profile">
        <span class="profile-mark" aria-hidden="true">♟</span>
        <strong>{{ player.username }}</strong>
      </section>

      <app-matchmaking-panel [autoOpenExistingGame]="true" />

      <section class="panel" aria-labelledby="activity-title">
        <h2 id="activity-title">Messages & activity</h2>
        <p class="chat-placeholder muted">Chat coming later</p>
      </section>

      <details class="panel profile-details">
        <summary>Profile & statistics</summary>

        <div class="profile-content">
          <app-player-statistics />
          <app-profile-editor />
        </div>
      </details>
    </aside>
  </div>
  }
</main>
